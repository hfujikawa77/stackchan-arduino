servo: 
  pin: 
    x: 7
    y: 6
  offset: 
    x: 0
    y: 0
  center:
    # SG90: x:90 y:90
    # SCS0009: x:150, y:150
    # Dynamixel XL330: x:180, y:270
    # M5StackChan: x:150, y:90
    x: 150
    y: 90
  lower_limit:
    x: 0
    y: 0
  upper_limit:
    x: 300
    y: 90
  speed: 
    normal_mode: 
      interval_min: 3000
      interval_max: 6000
      move_min: 500
      move_max: 1500
    sing_mode: 
      interval_min: 500
      interval_max: 1000
      move_min: 500
      move_max: 1000
takao_base: false
servo_type: "M5_SCS"
blue tooth: 
  device_name: "M5StackBTSPK"
  starting_state: false
  start_volume: 100
auto_power_off_time: 0
balloon: 
  font_language: "CN"
  lyrics:
  - "こんにちは"
  - "Hello"
  - "I'm Stack-chan"
led_lr: 0
led_pin: 15
extend_config_filename: ""
extend_config_filesize: 0
secret_config_filename: "/yaml/SC_SecConfig.yaml"
secret_config_filesize: 2048
secret_info_show: true
