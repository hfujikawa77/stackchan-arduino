<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Stack-chan reveal.js bridge demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section><h2>0: Neutral</h2><p>頭を前へなでると次へ</p></section>
    <section><h2>1: Happy</h2></section>
    <section><h2>2: Doubt</h2></section>
    <section><h2>3: Sad</h2></section>
    <section><h2>4: Angry</h2></section>
    <section><h2>5: Sleepy</h2></section>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="stackchan-bridge.js"></script>
  <script>Reveal.initialize({ hash: true, plugins: [StackchanBridge] });</script>
</body>
</html>
