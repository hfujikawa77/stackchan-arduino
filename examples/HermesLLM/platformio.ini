[platformio]
default_envs = m5stack-cores3

[env]
platform = espressif32 @ 6.5.0
framework = arduino
; upload_port = COM7
upload_speed = 115200
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++14
lib_deps =
  symlink://../../
  m5stack/M5Unified@0.1.16
  m5stack/M5GFX@>=0.1.16,<0.2.0   ; M5Unified 0.1.16 の M5GFX依存(>=0.1.17)が緩く 0.2系を引くので 0.1系に固定
  madhephaestus/ESP32Servo@0.13.0
  arminjo/ServoEasing@3.1.0
  bblanchon/ArduinoJson@7.4.3            ; ^7.0.0 → 現状の動作版に固定
  robotis-git/Dynamixel2Arduino@0.7.0   ; ^0.7.0 → 固定
  tobozo/YAMLDuino@1.5.0
  ; git URL 依存はデフォルトブランチ追従で勝手に変わるため、動作確認済みコミットに固定
  https://github.com/mavlink/c_library_v2.git#e5697c4
  https://github.com/mongonta0716/SCServo.git#ee6ee4a
  https://github.com/stack-chan/m5stack-avatar.git#7a90083
lib_ldf_mode = deep

[env:m5stack-cores3]
board = m5stack-cores3
