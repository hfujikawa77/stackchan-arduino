; -----------------------------------------------------------------------------
; MAVStackchan : Stack-chan(CoreS3) を MAVLink 機体として QGroundControl に見せるファーム
;
;   Phase 1 (現在): Wi-Fi UDP / HEARTBEAT 送信 / GCS 検知 / 未対応コマンドへの ACK
;   Phase 2 以降  : IMU 姿勢(ATTITUDE)、ARM/モード、Virtual Joystick、サーボ出力
;
;   ビルド環境は HermesLLM と同じ依存バージョンに揃えてある
;   (M5Unified / M5GFX の組み合わせ、mavlink c_library_v2 のコミット固定)。
; -----------------------------------------------------------------------------

[platformio]
default_envs = m5stack-cores3

[env]
platform = espressif32 @ 6.5.0
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++14
lib_deps =
  symlink://../../                       ; Stack-chan の頭部サーボ制御（StackchanSERVO）。HermesLLM と同じ
  m5stack/M5Unified@0.1.16
  m5stack/M5GFX@>=0.1.16,<0.2.0   ; M5Unified 0.1.16 が引く M5GFX を 0.1系に固定(0.2系で画面が出ない事例あり)
  madhephaestus/ESP32Servo@0.13.0
  arminjo/ServoEasing@3.1.0
  bblanchon/ArduinoJson@7.4.3
  robotis-git/Dynamixel2Arduino@0.7.0
  tobozo/YAMLDuino@1.5.0
  https://github.com/mavlink/c_library_v2.git#e5697c4
  https://github.com/mongonta0716/SCServo.git#ee6ee4a
lib_ldf_mode = deep

[env:m5stack-cores3]
board = m5stack-cores3
; data/ 配下（data/yaml/SC_SecConfig.yaml）を SPIFFS に書き込む（pio run -t uploadfs）
board_build.filesystem = spiffs
board_build.partitions = default_16MB.csv
