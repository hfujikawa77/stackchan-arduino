[platformio]
default_envs = m5stack-cores3

; -----------------------------------------------------------------------------
; NfcProbe : Stack-chan(CoreS3)内蔵 NFC(ST25R3916) 検証用スケッチ
;
;   目的(Issue #25 の Step A):
;     - 内蔵NFCが I2C バスのどこに居て M5UnitUnified で叩けるかを実機確認
;     - カード(Pasmo/Suica=FeliCa, 入館証=MIFARE)をかざして ID を画面表示
;
;   注意:
;     - 内蔵 ST25R3916 は「内部I2C(M5.In_I2C)」に接続(公式 StackChan チュートリアル準拠)
;     - M5Unit-NFC は M5UnitUnified(>=0.5.0)に依存。M5Unified / M5Utility は
;       依存解決で自動取得される。HermesLLM の M5Unified@0.1.16 とは別環境なので
;       ここでは最新系が入る(= Step B 統合前のバージョン影響確認も兼ねる)。
; -----------------------------------------------------------------------------

[env]
platform = espressif32 @ 6.5.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17            ; M5UnitUnified は C++17 を要求
lib_ldf_mode = deep
lib_deps =
  m5stack/M5Unified@^0.2.2   ; M5UnitUnified は M5Unified を自動では引かないので明示
  https://github.com/m5stack/M5Unit-NFC.git

[env:m5stack-cores3]
board = m5stack-cores3
